#
# OpenAPI 限流配置。
# 注意：本文件应被 include 在 nginx 的 http 上下文内，limit_req_zone/map 不能放在 server 内。
# - 通用 OpenAPI：按来源 IP 做基础限流，防止接口被刷。
# - 创建场景接口：只限制 POST，避免 OPTIONS 预检/GET 查询占用新增接口额度。
#
map_hash_bucket_size 64;

limit_req_zone $binary_remote_addr zone=h3d_openapi_ip:10m rate=10r/s;

map $request_method $h3d_openapi_create_limit_key {
    default "";
    POST $binary_remote_addr;
}

# OpenAPI CORS 白名单。仅允许生产域名和本地开发页面跨域调用。
map $http_origin $h3d_openapi_cors_origin {
    default "";
    "http://localhost:8001" $http_origin;
    "http://127.0.0.1:8001" $http_origin;
    "https://d6ctest.haolink.cn" $http_origin;
    "https://d6cnext.haolink.cn" $http_origin;
    "http://d6c.haolink.cn:20001" $http_origin;
    "https://vothing.haolink.cn" $http_origin;
    "https://vothing.haolink.cn:8070" $http_origin;
}

limit_req_zone $h3d_openapi_create_limit_key zone=h3d_openapi_create_ip:10m rate=5r/m;

server {
    listen 8070 ssl;
    http2 on;

    server_name vothing.haolink.cn _;

    client_max_body_size 200m;
    limit_req_status 429;
    error_page 429 = @openapi_rate_limited;

    # =========================
    # SSL 证书配置
    # =========================
    ssl_certificate      D:/www/AstralCerts/haolink.cn.pem;
    ssl_certificate_key  D:/www/AstralCerts/haolink.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # =========================
    # 前端静态资源缓存策略
    # =========================

    # 入口 HTML：不强缓存，避免发版后用户继续拿旧入口
    location = /index.html {
        root D:/www/Astral3dEditor;
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # 根路径也按入口处理，避免访问 / 时被缓存
    location = / {
        root D:/www/Astral3dEditor;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # 运行时配置：文件名固定，不要强缓存
    location = /_astral3d.config.js {
        root D:/www/Astral3dEditor;
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # Vite / Umi 等构建出来的 hash 资源：长期缓存
    location ^~ /assets/ {
        root D:/www/Astral3dEditor;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        etag on;
    }

    # Draco 解码器：文件名没有 hash，但通常比较稳定，给中等缓存
    location ^~ /libs/draco/ {
        root D:/www/Astral3dEditor;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
        etag on;
    }

    # 业务 wasm：文件名没有 hash，容易和 JS 版本强相关，不建议强缓存
    location ^~ /wasm/ {
        root D:/www/Astral3dEditor;

        # 确保 wasm MIME 正确
        types {
            application/wasm wasm;
        }

        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # 非 hash 静态资源：图片、模型、resource 等，先保守缓存 1 天
    location ^~ /static/ {
        root D:/www/Astral3dEditor;
        add_header Cache-Control "public, max-age=86400" always;
        expires 1d;
        etag on;
    }

    # SPA 路由兜底：不要在这里配置长缓存
    location / {
        root D:/www/Astral3dEditor;
        try_files $uri $uri/ /index.html;
        index index.html;

        # 对未单独命中的根目录文件、SPA fallback 保守处理
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # =========================
    # 后端 API 代理
    # =========================

    location @openapi_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $h3d_openapi_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-H3d-Api-Key, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        return 429 '{"code":429,"success":false,"message":"请求过于频繁，请稍后再试"}';
    }

    # OpenAPI 创建场景：严格限流。POST /api/openapi/v1/scenes
    location = /api/openapi/v1/scenes {
        add_header Access-Control-Allow-Origin $h3d_openapi_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-H3d-Api-Key, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=h3d_openapi_ip burst=30 nodelay;
        limit_req zone=h3d_openapi_create_ip burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI 创建场景：兼容末尾斜杠。POST /api/openapi/v1/scenes/
    location = /api/openapi/v1/scenes/ {
        add_header Access-Control-Allow-Origin $h3d_openapi_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-H3d-Api-Key, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=h3d_openapi_ip burst=30 nodelay;
        limit_req zone=h3d_openapi_create_ip burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI 其它接口：基础限流。包括模板列表、场景安全详情查询等。
    location ^~ /api/openapi/ {
        add_header Access-Control-Allow-Origin $h3d_openapi_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-H3d-Api-Key, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req zone=h3d_openapi_ip burst=30 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8080/api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS 下这里会传 https
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # =========================
    # LLM API 代理：保留流式响应配置
    # =========================

    location /llm-api/ {
        proxy_pass http://127.0.0.1:3001/api/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应相关配置
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =========================
    # LLM Demo 页面代理
    # =========================

    location = /llm {
        return 302 /llm/demos/;
    }

    location = /llm/ {
        return 302 /llm/demos/;
    }

    location /llm/ {
        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # WebSocket
    # =========================

    location /socket {
        proxy_pass http://127.0.0.1:8080/api/sys/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # HTTPS 入口下后端能知道原始协议是 https
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # =========================
    # 后端静态文件代理
    # =========================

    location /file/static {
        log_not_found off;
        access_log off;

        add_header Cache-Control "public, max-age=15768000";

        proxy_pass http://127.0.0.1:8080/api/common/static;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
